<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" font-family="Helvetica, Arial, sans-serif">
  <title>Arquitetura do Módulo 3 (Docker Compose)</title>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <rect width="900" height="600" fill="#ffffff"/>

  <!-- Rede interna do Compose -->
  <rect x="220" y="40" width="660" height="500" rx="12" fill="#f4f8fc" stroke="#5b7fa6" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="240" y="68" font-size="16" font-weight="bold" fill="#2f4f73">rede interna do Docker Compose</text>

  <!-- Usuário -->
  <rect x="30" y="240" width="140" height="70" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="100" y="270" font-size="15" font-weight="bold" text-anchor="middle" fill="#222">Usuário</text>
  <text x="100" y="290" font-size="13" text-anchor="middle" fill="#444">(navegador / curl)</text>

  <!-- servico-pedidos -->
  <rect x="270" y="230" width="200" height="90" rx="8" fill="#fff4e0" stroke="#c77d00" stroke-width="2"/>
  <text x="370" y="262" font-size="15" font-weight="bold" text-anchor="middle" fill="#222">servico-pedidos</text>
  <text x="370" y="282" font-size="12" text-anchor="middle" fill="#444">Django/DRF + gunicorn</text>
  <text x="370" y="300" font-size="12" text-anchor="middle" fill="#444">porta 8000</text>

  <!-- servico-clientes -->
  <rect x="620" y="90" width="230" height="80" rx="8" fill="#e8f4ea" stroke="#3a8a4a" stroke-width="2"/>
  <text x="735" y="122" font-size="15" font-weight="bold" text-anchor="middle" fill="#222">servico-clientes</text>
  <text x="735" y="142" font-size="12" text-anchor="middle" fill="#444">FastAPI + uvicorn, porta 8000</text>

  <!-- db (cilindro) -->
  <path d="M620,250 a115,14 0 0,0 230,0 v55 a115,14 0 0,1 -230,0 z" fill="#e6eefb" stroke="#3b5fa8" stroke-width="2"/>
  <ellipse cx="735" cy="250" rx="115" ry="14" fill="#f3f7fd" stroke="#3b5fa8" stroke-width="2"/>
  <text x="735" y="285" font-size="15" font-weight="bold" text-anchor="middle" fill="#222">db</text>
  <text x="735" y="304" font-size="12" text-anchor="middle" fill="#444">PostgreSQL 18, porta 5432</text>

  <!-- volume pgdata -->
  <rect x="640" y="380" width="190" height="56" rx="6" fill="#ffffff" stroke="#3b5fa8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="735" y="404" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">volume pgdata</text>
  <text x="735" y="423" font-size="12" text-anchor="middle" fill="#444">/var/lib/postgresql</text>
  <line x1="735" y1="320" x2="735" y2="380" stroke="#3b5fa8" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- servico-produtos (sem entrada) -->
  <rect x="270" y="430" width="200" height="80" rx="8" fill="#f1f1f1" stroke="#777" stroke-width="2"/>
  <text x="370" y="462" font-size="15" font-weight="bold" text-anchor="middle" fill="#222">servico-produtos</text>
  <text x="370" y="482" font-size="12" text-anchor="middle" fill="#444">FastAPI + uvicorn, porta 8000</text>
  <text x="370" y="499" font-size="12" font-style="italic" text-anchor="middle" fill="#666">nenhum serviço o chama hoje</text>

  <!-- Setas -->
  <!-- usuário -> pedidos -->
  <line x1="170" y1="275" x2="268" y2="275" stroke="#333" stroke-width="2" marker-end="url(#seta)"/>
  <text x="208" y="222" font-size="12" font-weight="bold" text-anchor="middle" fill="#222" stroke="#ffffff" stroke-width="5" paint-order="stroke">127.0.0.1:8000</text>
  <text x="208" y="238" font-size="11" text-anchor="middle" fill="#444" stroke="#ffffff" stroke-width="5" paint-order="stroke">só em localhost</text>

  <!-- pedidos -> clientes -->
  <path d="M370,230 V130 H618" fill="none" stroke="#333" stroke-width="2" marker-end="url(#seta)"/>
  <text x="495" y="104" font-size="12" font-weight="bold" text-anchor="middle" fill="#222">HTTP interno (síncrono)</text>
  <text x="495" y="121" font-size="12" font-family="Menlo, Consolas, monospace" text-anchor="middle" fill="#444">http://servico-clientes:8000</text>

  <!-- pedidos -> db -->
  <line x1="470" y1="275" x2="618" y2="275" stroke="#333" stroke-width="2" marker-end="url(#seta)"/>
  <text x="545" y="266" font-size="12" font-weight="bold" text-anchor="middle" fill="#222">SQL</text>
  <text x="545" y="293" font-size="12" font-family="Menlo, Consolas, monospace" text-anchor="middle" fill="#444">db:5432</text>

  <!-- Nota -->
  <text x="450" y="572" font-size="13" text-anchor="middle" fill="#444">Só o servico-pedidos publica porta no host. Os demais só são alcançáveis pela rede interna.</text>
</svg>
