[project]
name = "ecommerce-sd"
version = "0.1.0"
description = "Sistema de pedidos de e-commerce simplificado - Sistemas Distribuídos (DCC/UERN)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.2",
    "djangorestframework>=3.18.3",
    "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: ordenação de imports, UP: sintaxe moderna,
# DJ: regras específicas de Django, RUF: regras do próprio ruff.
select = ["E", "W", "F", "I", "UP", "DJ", "RUF"]
